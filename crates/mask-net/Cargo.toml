[package]
name = "mask-net"
version = "0.2.0"
edition = "2024"
description = "MASK relay network: protocol, relays, and test client (experimental, NOT anonymous)"
publish = false

[[bin]]
name = "mask-relay"
path = "src/bin/mask-relay.rs"

[[bin]]
name = "mask-client"
path = "src/bin/mask-client.rs"

[dependencies]
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
getrandom = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.6", features = ["derive"] }
