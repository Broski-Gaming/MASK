[package]
name = "mask-net"
version = "0.7.0"
edition = "2024"
description = "MASK relay network: protocol, relays, authority, and hidden services (experimental, NOT anonymous)"
publish = false

[[bin]]
name = "mask-relay"
path = "src/bin/mask-relay.rs"

[[bin]]
name = "mask-client"
path = "src/bin/mask-client.rs"

[[bin]]
name = "mask-service"
path = "src/bin/mask-service.rs"

[[bin]]
name = "mask-directory"
path = "src/bin/mask-directory.rs"

[[bin]]
name = "mask-authority"
path = "src/bin/mask-authority.rs"

[dependencies]
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
getrandom = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.6", features = ["derive"] }
serde_json = "1"
# Cryptography (RustCrypto / dalek). MORP uses only these established primitives.
ed25519-dalek = { version = "3", features = ["zeroize"] }
x25519-dalek = { version = "3", features = ["static_secrets", "zeroize"] }
chacha20poly1305 = "0.11"
hkdf = "0.13"
hmac = "0.13"
sha2 = "0.11"
zeroize = { version = "1.9", features = ["derive"] }
sha3 = "0.12"
data-encoding = "2.11"
# Service directory (HTTP on 127.0.0.1 only). reqwest without default features:
# no TLS and no system proxy, so lookups can never leave the machine via a proxy.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
reqwest = { version = "0.13", default-features = false }
url = "2.5"
percent-encoding = "2.3"
nix = { version = "0.31", features = ["signal"] }
# Noise Protocol Framework for authenticated, encrypted links (RustCrypto backends only).
snow = { version = "0.10", default-features = false, features = ["use-chacha20poly1305", "use-curve25519", "use-sha2", "use-getrandom"] }
toml = "1"  # configuration files

[dev-dependencies]
tempfile = "3"
