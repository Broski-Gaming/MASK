# The authority admits ONLY these relays. Each nickname is bound to one
# identity key, one role, and one family (machine label): a relay that comes
# back with a different key, role, or family is refused until you edit this
# file.
#
# Get each block on the relay's machine with:
#   mask-relay --config relay.toml --print-identity
# Restart mask-authority after editing.
#
# family:   must equal the relay's relay.toml `family` (the machine it runs on).
#           Paths never put two hops from one family on a circuit when they
#           can avoid it, so this must be honest: bind it here, not in the relay.
# operator: optional; who runs the machine (a person or organisation). Paths
#           also avoid two hops from one operator. Published in the consensus.

[[relay]]
nickname = "entry1"
identity = "REPLACE_WITH_OUTPUT_OF_mask-relay_--print-identity"
role = "entry"
family = "machine-a"
operator = "operator-1"

[[relay]]
nickname = "rv1"
identity = "REPLACE_WITH_OUTPUT_OF_mask-relay_--print-identity"
role = "rendezvous"
family = "machine-a"
operator = "operator-1"

[[relay]]
nickname = "middle1"
identity = "REPLACE_WITH_OUTPUT_OF_mask-relay_--print-identity"
role = "middle"
family = "machine-b"
operator = "operator-1"

[[relay]]
nickname = "rv2"
identity = "REPLACE_WITH_OUTPUT_OF_mask-relay_--print-identity"
role = "rendezvous"
family = "machine-b"
operator = "operator-1"

[[relay]]
nickname = "entry2"
identity = "REPLACE_WITH_OUTPUT_OF_mask-relay_--print-identity"
role = "entry"
family = "machine-c"
operator = "operator-1"

[[relay]]
nickname = "middle2"
identity = "REPLACE_WITH_OUTPUT_OF_mask-relay_--print-identity"
role = "middle"
family = "machine-c"
operator = "operator-1"
