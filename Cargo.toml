[workspace]
members = [".", "crates/mask-net"]
default-members = [".", "crates/mask-net"]
resolver = "3"

[package]
name = "mask"
version = "0.7.0"
edition = "2024"
description = "MASK (Multi-hop Anonymous Service Kit): experimental privacy browser and onion-routing network"
publish = false
default-run = "mask-browser"

[[bin]]
name = "mask-browser"
path = "src/main.rs"

[dependencies]
# GTK3 + WebKitGTK versions must match the ones wry 0.57 is built against.
gtk = "0.18"
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
wry = { version = "0.57", default-features = false, features = ["os-webview"] }
url = "2.5"
mask-net = { path = "crates/mask-net" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time"] }
http = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
# Evaluates the content-blocking rules in unit tests (already in Cargo.lock).
regex-automata = { version = "0.4", default-features = false, features = ["std", "syntax", "meta", "nfa-pikevm", "unicode-case"] }
